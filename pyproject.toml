[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-project-name"  # CHANGE THIS
version = "0.1.0"
description = "Your project description"  # CHANGE THIS
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"},  # CHANGE THIS
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/your-project"  # CHANGE THIS
"Bug Tracker" = "https://github.com/yourusername/your-project/issues"  # CHANGE THIS

# ============================================================================
# RUFF CONFIGURATION - Fast, comprehensive Python linting
# Replaces: black, isort, flake8, autoflake, pyupgrade, bandit
# ============================================================================

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    # Core quality checks
    "E4",   # Import errors
    "E7",   # Statement errors  
    "E9",   # Runtime errors
    "W",    # Warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    
    # Code quality
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "PIE",  # flake8-pie
    
    # Security (selective)
    "S102", "S103", "S105", "S106", "S107", "S108",
    "S301", "S302", "S303", "S324", "S501", "S506",
    
    # Performance
    "PERF",
    
    # Path handling
    "PTH",
    
    # Complexity
    "C90",
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "S101",   # Assert usage (OK in tests)
    "PTH123", # open() -> Path.open() (gradual migration)
]

# Auto-fixing (safe fixes only)
fixable = [
    "F401",  # Unused imports
    "I",     # Import sorting
    "UP",    # Python upgrade suggestions
    "W291", "W292", "W293",  # Whitespace
    "E231", "E201", "E202",  # Whitespace in brackets
]

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = true
known-first-party = ["your_package"]  # CHANGE THIS
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# MYPY CONFIGURATION - Type checking
# ============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, tighten over time
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

# ============================================================================
# PYTEST CONFIGURATION - Testing
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

# ============================================================================
# SETUPTOOLS CONFIGURATION
# ============================================================================

[tool.setuptools.packages.find]
where = ["src"]
include = ["your_package*"]  # CHANGE THIS
exclude = ["tests*"]

