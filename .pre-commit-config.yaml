# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update: pre-commit autoupdate

repos:
  # Ruff - Fast Python linter (replaces flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        name: 🚀 Ruff Linting [AUTO-FIX]
      - id: ruff-format
        name: 🎨 Ruff Formatting [AUTO-FIX]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        name: 🔒 Security Scan (Bandit) [BLOCKING]

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        name: 🔍 Detect Secrets [BLOCKING]

  # File checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: ✅ YAML Validation [AUTO-FIX]
      - id: check-json
        name: ✅ JSON Validation [AUTO-FIX]
      - id: check-toml
        name: ✅ TOML Validation [AUTO-FIX]
      - id: end-of-file-fixer
        name: 📝 Fix EOF [AUTO-FIX]
      - id: trailing-whitespace
        name: 🧹 Trim Trailing Whitespace [AUTO-FIX]
      - id: check-merge-conflict
        name: 🔍 Check Merge Conflicts [BLOCKING]
      - id: detect-private-key
        name: 🔒 Detect Private Keys [BLOCKING]
      - id: check-case-conflict
        name: 🔍 Check Case Conflicts [AUTO-FIX]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        name: 🚫 Block Large Files [BLOCKING]

  # Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        name: ✅ Conventional Commits [BLOCKING]

  # Type checking (optional - uncomment if using mypy)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       args: [--strict, --ignore-missing-imports]
  #       additional_dependencies: [types-all]
  #       name: 🔍 Type Check (MyPy) [BLOCKING]

